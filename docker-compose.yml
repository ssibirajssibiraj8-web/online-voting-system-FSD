version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aethelgard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-voting_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aethelgard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voting_db
      JWT_SECRET: ${JWT_SECRET:-super-secret-aethelgard-crypto-key-change-in-production-2026-xyz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-refresh-crypto-key-change-in-production-2026-xyz}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aethelgard-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
